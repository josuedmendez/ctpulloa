  <script>
    (() => {
      const postId = new URLSearchParams(location.search).get('post');
      if (!postId) return;
      const listing = document.querySelector('#cooperative-blog');
      const preview = document.querySelector('#blog-post-preview');
      document.body.classList.add('blog-post-preview-mode');
      listing.hidden = true;
      preview.hidden = false;
      preview.innerHTML = '<p class="cooperative-loading">Cargando publicación...</p>';
      fetch(`https://blog.ctpulloa.com/wp-json/wp/v2/posts/${encodeURIComponent(postId)}?_embed=1`)
        .then(response => { if (!response.ok) throw new Error(); return response.json(); })
        .then(post => {
          const media = post._embedded?.['wp:featuredmedia']?.[0];
          const category = post._embedded?.['wp:term']?.flat()?.find(term => term.taxonomy === 'category')?.name || 'Publicación';
          const date = new Date(post.date).toLocaleDateString('es-CR', { day: '2-digit', month: '2-digit', year: 'numeric' });
          preview.innerHTML = `
            <article class="blog-post-preview-card">
              ${media?.source_url ? `<img class="blog-post-preview-image" src="${media.source_url}" alt="${media.alt_text || ''}">` : ''}
              <div class="blog-post-preview-content">
                <div class="publication-modal-meta"><span>${category}</span><time datetime="${post.date.slice(0, 10)}">${date}</time></div>
                <h1>${post.title?.rendered || ''}</h1>
                <div class="publication-modal-actions"><button class="facebook-share-button" id="blog-post-share" type="button"><span class="facebook-share-icon" aria-hidden="true">f</span><span>Compartir en Facebook</span></button></div>
                <div class="publication-modal-body">${post.content?.rendered || ''}</div>
              </div>
            </article>`;
          preview.querySelector('#blog-post-share').addEventListener('click', () => openFacebookShareWindow(`https://www.ctpulloa.com/blog.html?post=${encodeURIComponent(postId)}`));
        })
        .catch(() => { preview.innerHTML = '<p class="cooperative-empty">No se pudo cargar esta publicación.</p>'; });
    })();
  </script>
